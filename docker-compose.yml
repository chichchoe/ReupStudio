services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reup
      POSTGRES_PASSWORD: reup
      POSTGRES_DB: reup
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reup"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://reup:reup@postgres:5432/reup
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /media
    ports: ["8000:8000"]
    volumes:
      - ./media:/media
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://reup:reup@postgres:5432/reup
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /media
      WHISPER_DEVICE: cpu
      WHISPER_MODEL: base
    volumes:
      - ./media:/media
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
