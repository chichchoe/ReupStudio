[project]
name = "reup-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "reup-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "alembic>=1.13",
    "celery>=5.4",
    "python-multipart>=0.0.9",
    # Chuyển từ nhóm dev lên đây: API gọi thẳng /models của nhà cung cấp LLM để
    # đổ ô chọn (services/llm_model_service.py), nên httpx là phụ thuộc lúc
    # CHẠY THẬT chứ không còn chỉ để TestClient dùng. Không phải thư viện mới —
    # apps/worker đã dùng đúng httpx này.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
# api và worker đều có package tên `src`; ép `pythonpath = .` để chạy trong thư
# mục nào thì lấy `src` của app đó, không phụ thuộc thứ tự sys.path.
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
