[project]
name = "reup-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "reup-core",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "yt-dlp>=2024.8.6",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    # M4-WK-01 (reframe.py) KHÔNG dùng cv2 — subject_column chỉ dùng numpy.
    # Cài sẵn ở đây cho M3 (detect/static_logo.py dùng morphology, inpaint/fast.py
    # dùng cv2.inpaint) — đừng tưởng M4 đang dùng opencv chỉ vì thấy dòng này.
    "opencv-python>=4.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Cài riêng vì nặng: pip install -e "apps/worker[ai]"
#
# torch kéo về ~2 GB, simple-lama tải thêm ~200 MB weights lần chạy đầu. Worker
# Docker chỉ chạy M1 thì KHÔNG cần nhóm này.
#
# Lưu ý cài đặt: Python 3.14 bản python.org thiếu bộ chứng chỉ SSL nên lần tải
# model đầu tiên hỏng với CERTIFICATE_VERIFY_FAILED. Cách chạy được:
#   SSL_CERT_FILE=$(python -c "import certifi; print(certifi.where())")
ai = [
    "faster-whisper>=1.0.3",
    # M3 — dò và xoá watermark / phụ đề cứng
    "rapidocr-onnxruntime>=1.2.3",   # dò chữ, chạy ONNX qua CoreML
    "torch>=2.2",                    # nền chạy LaMa trên Metal
    "simple-lama-inpainting>=0.1.2", # model vá vùng đã xoá
    "Pillow>=10",
]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
